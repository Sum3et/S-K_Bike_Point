server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sk-bike-point-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:skbikepointdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true

# JWT Configuration
jwt:
  # Secret key (at least 256 bits / 32 bytes for HMAC-SHA256)
  secret: ${JWT_SECRET:skBikePointWorkshopSecretKey2026SecureJWTTokenSuperLongKeyForHS256Algorithm}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Logging
logging:
  level:
    root: INFO
    com.skbikepoint: DEBUG
    org.springframework.security: INFO
